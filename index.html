<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>환상 수족관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
:root{
  --bg:#9fe3ec;--txt:#5a4038;--mut:#9a8070;--gold:#e39b1c;
  --cream:#fffaf1;--cream2:#fff3e2;--edge:#ecd3bb;--edgeD:#d4b08e;--stitch:#f6bfcf;--line:#ecd3bb;
  --vt:0px;--vh:100vh;--sb:0px;
}
html.safe{--sb:30px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Galmuri11','Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
input{font:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;image-rendering:pixelated}
.hidden{display:none!important}
.screen{position:fixed;left:0;right:0;top:var(--vt);height:var(--vh);z-index:2;display:none}
.screen.on{display:flex}
.jua,h1,h2,h3,h4{font-family:'Jua',sans-serif;font-weight:400}
.panel{background:var(--cream);border:3px solid var(--edge);border-radius:18px;box-shadow:0 5px 0 var(--edgeD),0 14px 30px rgba(40,70,90,.22);outline:2px dashed var(--stitch);outline-offset:-10px}
.btn{font-family:'Jua',sans-serif;font-size:17px;color:#fff;background:#bfa590;border:none;border-radius:13px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 #957b66;transition:transform .08s,filter .15s;white-space:nowrap;line-height:1.2;text-shadow:0 1px 0 rgba(90,50,40,.25)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,60,40,.4)}
.btn:disabled{opacity:.42;pointer-events:none;filter:grayscale(.5)}
.btn.blue{background:#5aa9f5;box-shadow:0 4px 0 #3a82cc}
.btn.red{background:#ff7d97;box-shadow:0 4px 0 #db5a7d}
.btn.gold{background:#ffd166;color:#6b4418;box-shadow:0 4px 0 #e0a83a;text-shadow:none}
.btn.green{background:#6fce7a;box-shadow:0 4px 0 #47a656}
.btn.purple{background:#b494f7;box-shadow:0 4px 0 #8a68d6}
.btn.teal{background:#4fc9c0;box-shadow:0 4px 0 #2f9e96}
.btn.ghost{background:#fff7ec;color:#7a5a48;box-shadow:0 4px 0 #e2c6a8;text-shadow:none;outline:2px solid #ecd3bb;outline-offset:-2px}
.btn.big{font-size:21px;padding:13px 20px}.btn.sm{font-size:14px;padding:7px 11px;border-radius:10px}
.btn small{font-size:12px;opacity:.92;display:block;font-family:'Galmuri11','Noto Sans KR';font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}
.mut{color:var(--mut)}
.tg{color:#d98a00;font-weight:700}.tb{color:#3d8fe0;font-weight:700}.tp{color:#a26be0;font-weight:700}.tr{color:#ec5a80;font-weight:700}.tgr{color:#2f9e5a;font-weight:700}
/* pixel sprites: 높이 기준, 가로는 그림 비율대로 */
.px{height:1.15em;width:auto;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:-.24em;display:inline-block;pointer-events:none}
.btn .px{vertical-align:-.26em}
/* ===== TITLE ===== */
#scrTitle{align-items:center;justify-content:center;overflow-y:auto;padding:16px}
.titleWrap{width:min(540px,100%);text-align:center;margin:auto;background:var(--cream);border:3px solid var(--edge);border-radius:24px;padding:20px 20px 18px;box-shadow:0 6px 0 var(--edgeD),0 18px 40px rgba(40,70,90,.25);outline:2px dashed var(--stitch);outline-offset:-11px}
.logoSign{position:relative;display:inline-block;margin:34px auto 2px;max-width:100%}
.signBoard{position:relative;padding:14px 18px 12px;background:repeating-linear-gradient(180deg,#e6b07a 0 13px,#d19659 13px 15px);border:4px solid #6e4127;border-radius:12px;box-shadow:0 6px 0 #53301c,inset 0 3px 0 #f5cf9a,inset 0 -3px 0 #b87a45}
.signTitle{font-family:'Galmuri11','Jua',sans-serif;font-weight:700;font-size:clamp(25px,7.6vw,40px);line-height:1.1;white-space:nowrap;letter-spacing:1px}
.signTitle i{display:inline-block;width:.32em}
.signTitle span{display:inline-block;color:var(--c);text-shadow:3px 0 0 #53301c,-3px 0 0 #53301c,0 3px 0 #53301c,0 -3px 0 #53301c,3px 3px 0 #53301c,-3px 3px 0 #53301c,3px -3px 0 #53301c,-3px -3px 0 #53301c,0 7px 0 #53301c;animation:hop 2.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes hop{0%,62%,100%{transform:translateY(0)}72%{transform:translateY(-7px)}82%{transform:translateY(0)}87%{transform:translateY(-2px)}}
.signPosts{display:flex;justify-content:space-between;padding:0 34px}
.signPosts i{display:block;width:16px;height:22px;background:#b0744a;border:4px solid #53301c;border-top:none;box-shadow:inset 3px 0 0 #c98c5c}
.signPeek{position:absolute;left:6px;right:6px;top:-36px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.signPeek .px{height:40px;vertical-align:bottom;animation:hop 2.2s ease-in-out infinite}
.signPeek .px:nth-child(2){animation-delay:.3s}.signPeek .px:nth-child(3){animation-delay:.6s}.signPeek .px:nth-child(4){animation-delay:.9s}
.subtitle{display:inline-block;background:#6cc7e8;color:#fff;padding:5px 18px 4px;border-radius:8px;border:3px solid #3a8fb5;box-shadow:0 4px 0 #3a8fb5;font-weight:700;font-size:15px;letter-spacing:2px;margin-top:12px;text-shadow:0 2px 0 #3a8fb5}
.tagline{color:#8a6a5a;font-size:13.5px;margin:10px 0 14px;line-height:1.6}
.menuCol{display:flex;flex-direction:column;gap:9px}
.saveNote{font-size:12px;color:#8a6a5a;margin-top:12px;line-height:1.5}
.homage{font-size:11.5px;color:#9a8070;margin-top:8px;line-height:1.5;border-top:2px dashed #f0dcc6;padding-top:8px}
.lvMini{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;margin:-4px 0 10px;color:#7a5a48}
/* ===== PAGE ===== */
#scrPage{flex-direction:column;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#pageHud{position:sticky;top:0;z-index:5}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,250,241,.96);border-bottom:3px solid var(--edge)}
.pill{background:#fff;border:2px solid var(--edge);color:#6b4a3a;padding:5px 11px;border-radius:999px;font-family:'Jua';font-size:16px;white-space:nowrap}
.pill .px{height:20px}
.hudSp{flex:1}
.xpbar{display:inline-block;width:110px;height:10px;background:#f0dfcb;border-radius:6px;overflow:hidden;vertical-align:middle;margin-left:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7fd3ff,#b494f7);transition:width .5s}
#pageBody{padding:16px 14px 50px;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
#pageBody>*{max-width:100%}
.pageTitle{display:inline-block;background:var(--cream);color:#6b4a3a;padding:6px 22px;border-radius:16px;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edgeD);outline:2px dashed var(--stitch);outline-offset:-8px;font-family:'Jua';font-size:28px;text-align:center}
.pageSub{background:rgba(255,250,241,.92);color:#7a5a48;padding:5px 14px;border-radius:12px;text-align:center;font-size:13.5px;line-height:1.55}
.card{background:rgba(255,250,241,.95);border:3px solid var(--edge);border-radius:18px;box-shadow:0 5px 0 var(--edgeD);padding:14px;width:min(980px,100%)}
.card h3{font-family:'Jua';font-size:21px;color:#e07a5f;margin-bottom:8px;display:flex;align-items:center;gap:8px}
/* map */
.world{position:relative;overflow:hidden}
.world .wbg{position:absolute;inset:0;opacity:.35;pointer-events:none}
.stages{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative}
.stg{width:118px;padding:10px 6px 8px;border-radius:16px;background:#fff;border:3px solid var(--edge);box-shadow:0 4px 0 #e2c6a8;text-align:center;cursor:pointer;position:relative;transition:transform .12s}
.stg:hover{transform:translateY(-3px)}
.stg .no{font-family:'Jua';font-size:24px;color:#4b3a45}
.stg .sn{font-size:11.5px;color:#7a5a48;min-height:30px;line-height:1.3;word-break:keep-all}
.stg .st3 .px{height:16px}
.stg .pt{position:absolute;top:-10px;right:-8px}
.stg .pt .px{height:30px}
.stg.boss{background:#ffeef3;border-color:#ff9fb5}
.stg.cur{border-color:#ffb347;animation:glow 1.8s ease-in-out infinite}
.stg.lock{opacity:.5;filter:grayscale(.8);cursor:default}
@keyframes glow{50%{box-shadow:0 4px 0 #e0a83a,0 0 20px rgba(255,179,71,.7)}}
/* pets */
.petGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;width:100%}
.pet{background:#fff;border:3px solid var(--edge);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 #ead2b6;position:relative}
.pet.on{border-color:#6fce7a;box-shadow:0 4px 0 #47a656,0 0 14px rgba(111,206,122,.45)}
.pet.lock{opacity:.55}
.pet .ph{display:flex;gap:10px;align-items:center}
.pet .ph .pic{width:64px;height:64px;flex:none;border-radius:14px;background:linear-gradient(180deg,#d9f6ff,#a8e2f0);display:flex;align-items:center;justify-content:center;border:2px solid #bfe6ef}
.pet .ph .pic .px{height:52px}
.pet .ph .pic.f5{background:linear-gradient(180deg,#fff3c9,#ffd98a)}
.pet .ph .pic.f10{background:linear-gradient(180deg,#ffe0f3,#c9b3ff);box-shadow:0 0 12px rgba(180,148,247,.7)}
.pet .pn{font-family:'Jua';font-size:18px}
.pet .pk{font-size:11.5px;color:var(--mut)}
.pet .pd{font-size:12.5px;line-height:1.5;color:#6b5048}
.pet .pt2{font-size:11.5px;line-height:1.45;color:#8a7a70;background:#fff7ec;border-radius:8px;padding:5px 7px}
.pet .pt2 b.on{color:#2f9e5a}
.lvBadge{display:inline-block;background:#ffd166;color:#6b4418;border-radius:8px;padding:0 6px;font-family:'Jua';font-size:14px;margin-left:4px}
.bar{height:9px;background:#f0dfcb;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff9fb5)}
/* talents */
.tTrees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(980px,100%)}
.tTree{background:rgba(255,250,241,.95);border:3px solid var(--edge);border-radius:18px;padding:12px;box-shadow:0 5px 0 var(--edgeD)}
.tTree h3{font-family:'Jua';font-size:20px;text-align:center;margin-bottom:8px}
.tal{background:#fff;border:2px solid var(--edge);border-radius:12px;padding:8px;margin-bottom:8px}
.tal .tn{font-family:'Jua';font-size:15.5px;display:flex;justify-content:space-between;gap:6px}
.tal .td{font-size:12px;line-height:1.45;color:#6b5048;margin:3px 0 6px}
.pips{display:flex;gap:3px;align-items:center}
.pips i{width:13px;height:13px;border-radius:4px;background:#f0dfcb;border:1px solid #d9bfa2}
.pips i.on{background:#ffd166;border-color:#e0a83a}
.tal .btn{margin-left:auto}
.tal.lock{opacity:.5}
/* dex */
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
.dex{background:#fff;border:2px solid var(--edge);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;box-shadow:0 3px 0 #ead2b6}
.dex .pic{height:62px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#d9f6ff,#a8e2f0);border-radius:10px;margin-bottom:6px}
.dex .pic .px{height:44px}
.dex .dn{font-family:'Jua';font-size:15px}
.dex .dk{font-size:11px;color:var(--mut)}
.dex.unk{opacity:.55}
.dex.unk .pic .px{filter:brightness(0) opacity(.35)}
.fact{background:#eef8ff;border:2px solid #b3dbff;border-radius:14px;padding:12px 14px;line-height:1.7;color:#4b3a45;font-size:14.5px}
.fact b{color:#2a78c6}
/* ===== GAME ===== */
#scrGame{flex-direction:column;align-items:stretch;padding:6px 8px calc(6px + var(--sb));gap:6px}
.gTop{display:flex;gap:6px;align-items:stretch;flex:none}
.money{flex:none;min-width:118px;background:var(--cream);border:3px solid var(--edge);border-radius:14px;box-shadow:0 4px 0 var(--edgeD);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 8px}
.money b{font-family:'Jua';font-size:24px;color:#d98a00;font-weight:400;line-height:1.05;white-space:nowrap}
.money b .px{height:22px;vertical-align:-3px}
.money span{font-size:11px;color:var(--mut)}
.money.bump b{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.18)}}
.shop{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;scrollbar-width:thin;overscroll-behavior:contain}
.sb{flex:none;width:76px;background:#fff;border:3px solid var(--edge);border-radius:13px;box-shadow:0 4px 0 #e2c6a8;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px 3px;cursor:pointer;position:relative;font-family:'Galmuri11','Noto Sans KR';transition:transform .08s}
.sb:active{transform:translateY(3px);box-shadow:0 1px 0 #e2c6a8}
.sb .ic{height:32px;display:flex;align-items:center}
.sb .ic .px{height:30px}
.sb .nm{font-size:10.5px;line-height:1.15;text-align:center;color:#6b4a3a;word-break:keep-all;min-height:24px;display:flex;align-items:center}
.sb .pr{font-family:'Jua';font-size:14px;color:#d98a00;line-height:1.1}
.sb .lv{position:absolute;top:2px;right:4px;font-size:10px;color:#3d8fe0;font-weight:700}
.sb.no{opacity:.5}
.sb.no .pr{color:#c0a090}
.sb.max .pr{color:#2f9e5a}
.sb.lockb{opacity:.45;filter:grayscale(.7)}
.sb.egg{background:#fff8e1;border-color:#ffc24d;box-shadow:0 4px 0 #e0a83a}
.sb.flash{animation:sbfl .5s}
@keyframes sbfl{0%{background:#fff27a}100%{}}
.tankWrap{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;border:4px solid #7a5238;box-shadow:0 5px 0 #53301c,inset 0 0 0 3px #b98a5e;background:#5ec4d8}
#tank{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:pointer}
#warn{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,80,110,0);transition:box-shadow .3s}
#warn.on{animation:warnP .8s infinite}
@keyframes warnP{50%{box-shadow:inset 0 0 60px 10px rgba(255,80,110,.55)}}
#bossHp{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:min(360px,70%);background:rgba(255,250,241,.92);border:3px solid #ff9fb5;border-radius:12px;padding:3px 8px;font-family:'Jua';font-size:13px;text-align:center;color:#a3395c;pointer-events:none}
#bossHp .bar{margin-top:2px;height:8px}#bossHp .bar i{background:linear-gradient(90deg,#ff6f91,#ffb35c)}
#pauseVeil{position:absolute;inset:0;background:rgba(40,70,90,.35);display:flex;align-items:center;justify-content:center;font-family:'Jua';font-size:34px;color:#fff;text-shadow:0 3px 0 #2a5a70;pointer-events:none}
.gBot{display:flex;gap:6px;align-items:center;flex:none;min-height:44px}
.eggs{display:flex;gap:2px;align-items:center;background:var(--cream);border:3px solid var(--edge);border-radius:12px;padding:2px 8px;box-shadow:0 3px 0 var(--edgeD)}
.eggs .px{height:28px}
.eggs .px.off{opacity:.25;filter:grayscale(1)}
.petBar{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;align-items:center}
.pb{position:relative;flex:none;width:44px;height:40px;background:#fff;border:2px solid var(--edge);border-radius:10px;display:flex;align-items:center;justify-content:center}
.pb .px{height:30px}
.pb .cd{position:absolute;left:2px;right:2px;bottom:2px;height:4px;background:#f0dfcb;border-radius:3px;overflow:hidden}
.pb .cd i{display:block;height:100%;background:#6fce7a}
.pb .lvb{position:absolute;top:-6px;right:-5px;background:#ffd166;color:#6b4418;font-family:'Jua';font-size:10px;border-radius:6px;padding:0 3px}
.skillBar{display:flex;gap:5px;align-items:center}
.sk{position:relative;width:48px;height:44px;border-radius:12px;background:#fff;border:3px solid #b494f7;box-shadow:0 3px 0 #8a68d6;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex:none;padding:0}
.sk .px{height:28px;position:relative;z-index:1}
.sk .cdv{position:absolute;left:0;right:0;bottom:0;background:rgba(74,51,80,.45);z-index:2;pointer-events:none}
.sk .kn{position:absolute;top:0;left:3px;font-size:10px;font-family:'Jua';color:#8a68d6;z-index:3}
.sk .lvk{position:absolute;bottom:0;right:3px;font-size:10px;font-family:'Jua';color:#6b4418;z-index:3}
.sk.ready{animation:skr 1.6s ease-in-out infinite}
@keyframes skr{50%{box-shadow:0 3px 0 #8a68d6,0 0 12px rgba(180,148,247,.9)}}
.sk:active{transform:translateY(2px)}
#combo{position:absolute;right:10px;top:8px;font-family:'Jua';font-size:22px;color:#fff;text-shadow:2px 0 0 #c95b7c,-2px 0 0 #c95b7c,0 2px 0 #c95b7c,0 -2px 0 #c95b7c;pointer-events:none;transition:transform .1s}
#combo small{font-size:14px;display:block;text-align:right}
#combo.pop{transform:scale(1.18)}
#feverTag{position:absolute;left:10px;top:8px;font-family:'Jua';font-size:18px;background:#ff8fb5;color:#fff;border:3px solid #c95b7c;border-radius:10px;padding:1px 10px;pointer-events:none;animation:blink .5s infinite}
.btn.on2{background:#ff8fb5;box-shadow:0 4px 0 #c95b7c;color:#fff}
.skRow{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--edge);border-radius:12px;padding:8px;margin-bottom:8px}
.skRow .sic{width:50px;height:50px;flex:none;border-radius:12px;background:#f3ecff;display:flex;align-items:center;justify-content:center}
.skRow .sic .px{height:36px}
.skRow .sbody{flex:1;min-width:0}
.skRow .sn{font-family:'Jua';font-size:16px}
.skRow .sd{font-size:12.5px;color:#6b5048;line-height:1.45}
.skRow.lock{opacity:.5}
.resGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.gInfo{font-family:'Jua';font-size:14px;color:#6b4a3a;background:var(--cream);border:2px solid var(--edge);border-radius:10px;padding:5px 8px;white-space:nowrap}
/* float, confetti */
.fl{position:fixed;z-index:90;pointer-events:none;font-family:'Jua';font-size:19px;padding:1px 8px;border-radius:9px;transform:translate(-50%,-50%);animation:flUp .95s ease-out forwards;white-space:nowrap;background:#fffaf1;color:#5a4038;border:2px solid var(--edge)}
.fl.g{background:#ffd166;color:#6b4418;border-color:#e0a83a}.fl.p{background:#b494f7;color:#fff;border-color:#8a68d6}.fl.r{background:#ff7d97;color:#fff;border-color:#db5a7d}
@keyframes flUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-100%)}100%{opacity:0;transform:translate(-50%,-135%)}}
.confetti{position:fixed;width:9px;height:14px;z-index:89;pointer-events:none;border-radius:2px;animation:conf 1.6s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rr));opacity:0}}
/* modal */
.modal{position:fixed;left:0;right:0;top:var(--vt);height:var(--vh);z-index:60;display:none;align-items:center;justify-content:center;background:rgba(40,70,90,.38);padding:14px;overscroll-behavior:contain}
.modal.on{display:flex}
#modal2{z-index:64}
.mbox{width:min(640px,100%);max-height:100%;overflow:auto;padding:22px;animation:mIn .22s;overscroll-behavior:contain}
.mbox.wide{width:min(900px,100%)}
@keyframes mIn{from{transform:translateY(20px) scale(.97);opacity:0}}
.mbox h2{font-size:27px;text-align:center;margin-bottom:8px}
.mbox h3{font-size:19px;margin:14px 0 6px;color:#e07a5f}
.mbox p,.mbox li{line-height:1.65;font-size:14.5px}
.mbox ul{padding-left:20px}

  const{g,W,H}=G;const cv=document.createElement('canvas');cv.width=W+2;cv.height=H+2;const c=cv.getContext('2d');
  const im=c.createImageData(W+2,H+2),d=im.data;const oc=vcol(hexRgb(OUTL),v==='white'?'':v);
  const at=(x,y)=>(y>=0&&y<H&&x>=0&&x<W)?g[y][x]:null;
  for(let y=0;y<H+2;y++)for(let x=0;x<W+2;x++){
    const col=at(x-1,y-1);let rgb=null;
    if(col)rgb=vcol(hexRgb(col),v);else if(at(x-2,y-1)||at(x,y-1)||at(x-1,y-2)||at(x-1,y))rgb=v==='white'?[255,240,250]:oc;
    if(rgb){const i=(y*(W+2)+x)*4;d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;}
  }
  c.putImageData(im,0,0);return cv;
}
function flipCanvas(src){const cv=document.createElement('canvas');cv.width=src.width;cv.height=src.height;const c=cv.getContext('2d');c.translate(src.width,0);c.scale(-1,1);c.drawImage(src,0,0);return cv;}
function spr(key,s=1,v=''){

  if(!SPDEF[key])key='qmark';
  const gk=key+'|'+s;let G=GRIDS[gk];if(!G)G=GRIDS[gk]=buildGrid(key,s);
  o=CANS[ck]={r:gridCanvas(G,v),l:null,W:G.W+2,H:G.H+2};return o;
}
function sprL(o){if(!o.l)o.l=flipCanvas(o.r);return o.l;}

// ===== 선생님과 함께: 학습 보고서 코드(학생 → 선생님) · 과제 코드(선생님 → 학생) — 서버 없이 코드·파일로 주고받아요 =====
function lms(){const m=S.meta;if(!m.lms)m.lms={cls:'',num:'',asg:{}};if(!m.lms.asg)m.lms.asg={};
  for(const a of Object.values(m.lms.asg))(a.words||[]).forEach(x=>{if(!WBY[x.e])WBY[x.e]={e:x.e,k:x.k,lv:WORDS[a.lv]?a.lv:'e3',custom:1};});return m.lms;}
async function packCode(tag,obj){let b=new TextEncoder().encode(JSON.stringify(obj)),z='A';if(window.CompressionStream){try{b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());z='Z';}catch(e){}}return tag+z+':'+b64u(b);}
async function unpackCode(text,tag){const m=String(text||'').replace(/\s+/g,'').match(new RegExp(tag+'([AZ]):([A-Za-z0-9_-]+)'));if(!m)return null;let b=ub64u(m[2]);if(m[1]==='Z')b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());return JSON.parse(new TextDecoder().decode(b));}
function lmsReport(){const m=S.meta,E=eng(),L=lms();const mem={};for(const l of ELV){const n=WORDS[l.id].filter(isMem).length;if(n)mem[l.id]=n;}
  const days={};for(let i=0;i<30;i++){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d);if(E.days[k])days[k]=E.days[k];}
  const wrong=Object.entries(E.w).filter(([e,o])=>o.x>0&&WBY[e]).sort((a,b)=>b[1].x-a[1].x).slice(0,40).map(([e,o])=>[e,WBY[e].k,o.x,o.s]);
  checkBadges(true);const bdgL=BADGES.filter(b=>(E.bdg[b[0]]??-1)>=0).map(b=>[b[0],b[1],E.bdg[b[0]]]);return{t:'SER',v:1,at:Date.now(),bdg:bdgL,name:m.name||'',school:m.school||'',cls:L.cls||'',num:L.num||'',lv:E.lv,xp:E.xp,elv:engLvOf(E.xp).l,tot:E.tot,ok:E.ok,memAll:wordsMemorized(),mem,days,wrong,due:dueWords().length,cards:E.cards,place:E.place||null,

  md+=`## 과제\n\n`+(Object.values(r.asg).map(a=>`- ${a.title}: ${a.best??'-'}점 · ${a.tries}번 도전${a.done?' · 통과':''}`).join('\n')||'- 받은 과제가 없어요')+'\n\n';

  md+=`## 자주 틀린 단어\n\n`+(r.wrong.slice(0,20).map(([e,k,x,s])=>`- ${e} (${k}) · ${x}번${s===2?' · 지금은 외움':''}`).join('\n')||'- 없어요')+'\n\n';
  md+=`## 제출 데이터\n\n\`\`\`ssc-report\n${code}\n\`\`\`\n`;return md;}

function bst(){const E=eng();if(!E.st)E.st={type:{},fast:0,cmb:0,best:0,am:{},pm:{},rev:0,crit:0,bub:0,deco:0};return E.st;}
function bstTrack(E,ok,hint,opt,was,o){const st=bst();const h=new Date().getHours(),dk=dayKey();
  if(ok&&!hint){if(opt.type)st.type[opt.type]=(st.type[opt.type]||0)+1;if(opt.ms&&opt.ms<3000)st.fast++;st.cmb++;if(st.cmb>st.best)st.best=st.cmb;}else if(!ok)st.cmb=0;
  if(h>=5&&h<9)st.am[dk]=1;if(h>=19)st.pm[dk]=1;for(const k of['am','pm']){const ks=Object.keys(st[k]);if(ks.length>200)ks.sort().slice(0,ks.length-200).forEach(x=>delete st[k][x]);}
  checkBadges();}

function mergeMeta(m){const d=defaultMeta();if(!m||typeof m!=='object')return d;if(!m.v2){d.v2=0;}if(!m.v3){d.v3=0;}if(!m.ver){d.ver=0;}for(const k in d){if(!(k in m))continue;if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))d[k]=Object.assign(d[k],m[k]);else d[k]=m[k];}return d;}

function shinyChance(){let c=.02;if(S.meta.lv>=12)c*=2;if(teamLv('mong')>=5)c*=2;return c+rs('luck')*.005+tb('luck')*.01+gs('shiny')/100;}
function spawnFish(sp,st,x,y,opt={}){
  if(R.fish.length>=FISH_CAP)return null;
  const D=FISH[sp];
  if(st==null)st=0;if(sp==='bub'&&opt.born&&(teamLv('mong')>=10||(combo('cradle')&&Math.random()<.5)))st=Math.max(st,1);
  const f={id:uid(),sp,st,x:x??rand(80,T.W-80),y:y??(TOP+20),vx:0,vy:0,tx:0,ty:0,wt:0,h:opt.h??.15,g:0,dt:rand(2,6),dir:Math.random()<.5?1:-1,
    shiny:Math.random()<shinyChance()?1:0,sh:0,bt:(D.st[st].breed||0)*(1-.1*tb('breed')),au:D.aurora||0,ink:D.ink||0,ms:D.makeStar||0,fo:D.forest?D.forest*.5:0,glow:0,mt:D.mirror||0,lt:D.leap?rand(8,D.leap):0,zt:0,ft:0,leap:0,pull:0,ph:Math.random()*6};
  R.fish.push(f);pickWander(f);
  const dx=S.meta.dex.fish[sp]||(S.meta.dex.fish[sp]={n:0,st:0,shiny:0});dx.n++;dx.st=Math.max(dx.st,st);if(f.shiny){dx.shiny=1;S.meta.stats.shiny=(S.meta.stats.shiny||0)+1;if(!SIM.on)toast(`${I(fishSprKey(f))} 반짝! 희귀 변이 <b>빛나는 ${esc(D.n)}</b>예요! 보물 2배`);}
  return f;
}
function fishSprKey(f){const st=FISH[f.sp].st[f.st];return st.spr||f.sp;}
function pickWander(f){const D=FISH[f.sp];const fl=floorY();f.tx=rand(40,T.W-40);f.ty=TOP+(fl-TOP)*rand(D.zone[0],D.zone[1]);f.wt=rand(2.5,6);}
function killFish(f,cause){
  const i=R.fish.indexOf(f);if(i<0)return;
  if(FISH[f.sp].regen&&!f.regen&&cause==='eaten'){f.regen=1;fxText(f.x,f.y-20,'다시 자라났어요!','#ff8a5c');fxRing(f.x,f.y,'#ffb38a');return;}
  if(cause!=='prey'&&gs('revive')&&Math.random()<gs('revive')/100){f.h=.2;fxText(f.x,f.y-20,'불사조 깃털!','#ff9a52');return;}
  // 불사조 피오: 되살리기
  const pl=teamLv('pio');
  if(pl&&cause!=='prey'&&Math.random()<(.3+.05*(pl-1))){f.h=pl>=5?0:.3;f.pull=0;fxText(f.x,f.y-20,'되살아났어요!','#ff9a52');fxRing(f.x,f.y,'#ffb347');petAct('pio',3);if(pl>=10)spawnCoin('shellG',f.x,f.y);if(combo('phoenixPearl'))spawnCoin('pearl',f.x,f.y);sfx('magic');return;}
  R.fish.splice(i,1);R.stats.lost++;if(R.mode==='abyss'&&cause==='eaten'){R.barrier=(R.barrier??100)-8;if(!SIM.on)fxText(T.W/2,TOP+30,'결계 -8','#ec5a80');}
  if(X.fx.length<FX_CAP)X.fx.push({t:'dead',k:fishSprKey(f),s:FISH[f.sp].st[f.st].s,x:f.x,y:f.y,dir:f.dir,life:2.2});
  sfx(cause==='hunger'?'die':'eat');
}
function growMul(){let m=1+tr('grow')*.08+rs('grow')*.06+gs('grow')/100+(tb('kForest')?.5:0)+(reso('nature')?.25*rm():0);const ml=teamLv('mong');if(ml)m+=.2+.04*(ml-1);if(R.laraT>0)m*=1.3;return m;}
function fishGrow(f,pts){
  const D=FISH[f.sp];f.g+=pts;
  while(D.st[f.st].grow&&f.g>=D.st[f.st].grow){f.g-=D.st[f.st].grow;f.st++;const st=D.st[f.st];
    if(st.breed)f.bt=st.breed;f.dt=rand(1,3);fxText(f.x,f.y-24,st.n+'!','#3d8fe0');fxRing(f.x,f.y,'#ffe27a');sfx('grow');
    const dx=S.meta.dex.fish[f.sp];if(dx)dx.st=Math.max(dx.st,f.st);gainXP(4);}
}
const _seah=[];
function updateFish(dt){
  const fl=floorY();_seah.length=0;for(const f of R.fish)if(f.sp==='seah')_seah.push(f);
  let nutri=1+tr('nutri')*.06;if(tb('kForest'))nutri/=1.2;if(reso('water'))nutri/=1-.25*rm()*(rm()>1?.8:1);if(R.rule==='cold')nutri*=1.3;nutri*=1+gs('hunger')/100;
  for(let i=R.fish.length-1;i>=0;i--){
    const f=R.fish[i];if(!f)continue;const D=FISH[f.sp],st=D.st[f.st];
    if(f.sh>0)f.sh-=dt;
    // 배고픔
    if(D.diet!=='none'){let hm=nutri;for(const s of _seah)if(s!==f&&Math.abs(s.x-f.x)<150&&Math.abs(s.y-f.y)<150){hm/=.6;break;}
      f.h+=dt/(D.hunger*hm);if(f.h>=1){killFish(f,'hunger');continue;}}
    const hungry=D.diet!=='none'&&f.h>=SEEK;
    let spd=D.spd*1.25*(R.rule==='cold'?.7:1),tx=f.tx,ty=f.ty;
    f.wt-=dt;if(f.wt<=0||(Math.abs(f.x-f.tx)<12&&Math.abs(f.y-f.ty)<12))pickWander(f);
    // 크라켄에게 끌려가기
    if(f.pull>0){f.pull-=dt;const m=X.mons.find(m=>MON[m.k].grab);if(m){tx=m.x;ty=m.y;spd=150;}}
    else{
      // 침입자 피하기
      if(!D.immune&&X.mons.length){let nm=null,nd=150*150;for(const m of X.mons){if(m.inv>0&&m.k!=='levi')continue;const d=(m.x-f.x)**2+(m.y-f.y)**2;if(d<nd){nd=d;nm=m;}}
        if(nm){tx=f.x+(f.x-nm.x)*2;ty=f.y+(f.y-nm.y)*2;spd*=1.35;}}
      if(hungry){
        let tg=null,td=1e12;
        if(D.diet==='food'){for(const p of X.food){const d=(p.x-f.x)**2+(p.y-f.y)**2;if(d<td){td=d;tg=p;}}}
        else if(D.diet==='prey'){for(const o of R.fish){if(o.sp!==D.prey||o===f)continue;if(D.prey==='bub'&&o.st!==0)continue;const d=(o.x-f.x)**2+(o.y-f.y)**2;if(d<td){td=d;tg=o;}}}
        else if(D.diet==='star'){for(const c of R.coins){if(c.k!=='star')continue;const d=(c.x-f.x)**2+(c.y-f.y)**2;if(d<td){td=d;tg=c;}}}
        if(tg){tx=tg.x;ty=tg.y;spd*=1.7;
          const er=16+12*st.s;if(td<er*er){
            if(D.diet==='food'){X.food.splice(X.food.indexOf(tg),1);f.h=0;fishGrow(f,FOOD[tg.tier].grow*growMul());sfx('eat');
              if(D.warm){for(const o of R.fish)if(o!==f&&(o.x-f.x)**2+(o.y-f.y)**2<120*120)fishGrow(o,1);fxRing(f.x,f.y,'#ff9a52');}}
            else if(D.diet==='prey'){if(tg.sh>0){}else{killFish(tg,'prey');f.h=0;fxText(f.x,f.y-20,'냠!','#a35bd6');}}
            else{R.coins.splice(R.coins.indexOf(tg),1);f.h=0;spawnCoin(st.starDrop||'gem',f.x,f.y+8,f.shiny?2:1);fxRing(f.x,f.y,'#fff27a');}
          }}
      }
    }
    // 하늘 날치 뛰어오르기
    if(D.leap){f.lt-=dt;if(f.leap>0){f.leap-=dt;ty=TOP-60;spd=170;if(f.leap<=0){spawnCoin('dust',f.x,TOP+4);spawnCoin('star',f.x+14,TOP+4);fxText(f.x,TOP+20,'별가루를 물어 왔어요!','#a26be0');}}
      else if(f.lt<=0&&!hungry){f.leap=1.1;f.lt=D.leap;sfx('bubble');}}
    // 움직이기
    const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy)||1;const k=Math.min(1,dt*2.6);
    f.vx+=(dx/d*spd-f.vx)*k;f.vy+=(dy/d*spd*.75-f.vy)*k;
    f.x=clamp(f.x+f.vx*dt,20,T.W-20);f.y=clamp(f.y+f.vy*dt,f.leap>0?TOP-70:TOP+10,fl-10);
    if(Math.abs(f.vx)>6)f.dir=f.vx>0?1:-1;
    // 보물 떨어뜨리기
    if(f.glow>0)f.glow-=dt;
    if(D.angel){f.ag=(f.ag||0)-dt;if(f.ag<=0){for(const o of R.fish){if(o.h>=.9&&(o.x-f.x)**2+(o.y-f.y)**2<170*170){o.h=.35;f.ag=8;fxBeam(f.x,f.y,o.x,o.y,'#fff27a');fxText(o.x,o.y-22,'천사의 손길!','#d99a1c');break;}}}}
    if(D.sand){for(const c of R.coins)if(c.on&&!c.sand&&Math.abs(c.x-f.x)<50&&Math.abs(c.y-f.y)<60){c.sand=1;c.mul*=1.6;c.ft+=2;fxText(c.x,c.y-12,'×1.6','#2f9e5a');}}
    if(D.filter){for(const q of X.food){const dx2=f.x-q.x,dy2=f.y-q.y;if(dx2*dx2+dy2*dy2<150*150){q.x+=dx2*dt*1.2;q.y+=dy2*dt*.6;}}}
    if(D.lay){f.lay=(f.lay??D.lay*.6)-dt;if(f.lay<=0){f.lay=D.lay;for(let k=0;k<3;k++){const b=spawnFish('bub',0,f.x+rand(-20,20),f.y,{born:1,h:0});if(b&&!b.shiny&&Math.random()<.3){b.shiny=1;S.meta.stats.shiny=(S.meta.stats.shiny||0)+1;}}R.stats.born+=3;fxText(f.x,f.y-24,'별똥 알!','#a26be0');}}
    if(D.bite&&X.mons.length){for(const m of X.mons)if(!MON[m.k].feed&&(m.x-f.x)**2+(m.y-f.y)**2<140*140){damageMon(m,4*(1+.5*tb('fishAtk'))*dt,f.x,f.y,'pet');if(Math.random()<dt*3)fxSpark(m.x,m.y,'#ff8a5c');}}
    if(D.aurora){f.au-=dt;if(f.au<=0){f.au=D.aurora;const c=R.fish.filter(o=>o!==f&&o.glow<=0&&FISH[o.sp].st[o.st].drop);const o=c.length?pick(c):null;if(o){o.glow=15;fxBeam(f.x,f.y,o.x,o.y,'#ffd1f0');fxText(o.x,o.y-24,'오로라!','#e06a9a');}}}
    if(D.makeStar){f.ms-=dt;if(f.ms<=0){f.ms=D.makeStar;spawnCoin('star',f.x,TOP+16);fxRing(f.x,f.y,'#ffe27a');}}
    if(D.forest){f.fo-=dt;if(f.fo<=0){f.fo=D.forest;const tier=Math.min(3,R.upg.foodQ+1);for(let k=0;k<3&&X.food.length<40;k++)X.food.push({x:clamp(f.x+rand(-40,40),20,T.W-20),y:f.y,tier,t:0,ph:Math.random()*6});fxText(f.x,f.y-24,'숲의 열매!','#2f9e5a');}}
    if(D.ink&&X.mons.length){f.ink-=dt;if(f.ink<=0){f.ink=D.ink;const m=nearestMon(f.x,f.y,9999,false);if(m){m.blind=4;fxBeam(f.x,f.y,m.x,m.y,'#4b3f74');fxText(m.x,m.y-30,'먹물!','#4b3f74');}}}
    if(st.drop){f.dt-=dt*(R.feverT>0?2:1);if(f.dt<=0){f.dt=st.dt*rand(.85,1.15)*(1-rs('fin')*.03)*(1-Math.min(.5,gs('drop')/100));spawnCoin(st.drop,f.x,f.y+8,(f.shiny?2:1)*(f.glow>0?2:1));if(st.star&&Math.random()<st.star)spawnCoin('star',f.x+8,f.y+6,1);}}
    if(st.breed&&!hungry){f.bt-=dt;if(f.bt<=0){f.bt=st.breed*(1-.1*tb('breed'));if(spawnFish('bub',0,f.x,f.y,{born:1,h:0})){R.stats.born++;fxText(f.x,f.y-22,'아기 탄생!','#ff8fb5');sfx('bubble');}}}
    if(D.mirror){f.mt-=dt;if(f.mt<=0){f.mt=D.mirror;let best=null,bv=0;for(const c of R.coins){const v=COIN[c.k].v*c.mul;if(v>bv&&c.k!=='dust'){bv=v;best=c;}}
      if(best){const c2=spawnCoin(best.k,best.x+rand(-20,20),Math.min(best.y,fl-40),best.mul);if(c2){fxBeam(f.x,f.y,c2.x,c2.y,'#dbe6fa');fxText(f.x,f.y-24,'거울 복사!','#6c86c8');}}}}
    if(D.lure){const lx=f.x+f.dir*22,ly=f.y-22;for(const c of R.coins){const ddx=lx-c.x,ddy=ly-c.y,dd=ddx*ddx+ddy*ddy;if(dd<80*80&&!c.on){c.x+=ddx*dt*1.4;if(!c.lit&&dd<26*26){c.lit=1;c.mul*=1.5;fxText(c.x,c.y-12,'×1.5','#d98a00');}}}}
    if(X.mons.length){
      if(D.zap){f.zt-=dt;if(f.zt<=0){f.zt=D.zap;const m=nearestMon(f.x,f.y,9999,true);if(m){damageMon(m,3*(1+.5*tb('fishAtk')),f.x,f.y,'zap');fxBeam(f.x,f.y,m.x,m.y,'#ffe066');sfx('zap');}}}
      if(st.fire){f.ft-=dt;if(f.ft<=0){f.ft=2.5;const m=nearestMon(f.x,f.y,320,true);if(m){damageMon(m,5*(1+.5*tb('fishAtk')),f.x,f.y,'fire');fxBeam(f.x,f.y,m.x,m.y,'#ff9a52');}}}
    }
  }
}
// --- 먹이 ---
function foodCost(){if(R.luckyT>0&&teamLv('uni')>=5)return 0;return Math.max(1,5-tr('cheap')-Math.floor(gs('food')))+(tb('kLight')?3:0);}
function foodMax(){return R.upg.foodN;}
function dropFood(x,y,free){
  if(!free){if(X.food.length>=foodMax()){tapMsg(x,y,'먹이가 꽉 찼어요');return false;}const c=foodCost();if(R.money<c){tapMsg(x,y,'금화가 모자라요');sfx('no');return false;}R.money-=c;}
  X.food.push({x,y:Math.max(TOP+4,y),tier:R.upg.foodQ,t:0,ph:Math.random()*6});sfx('food');return true;
}
function updateFood(dt){const fl=floorY();for(let i=X.food.length-1;i>=0;i--){const p=X.food[i];if(R.curV)p.x=clamp(p.x+R.curV*.8*dt,10,T.W-10);if(p.y<fl-4)p.y+=75*dt;else{p.t+=dt;if(p.t>2.5)X.food.splice(i,1);}}}
// --- 보물 ---
function spawnCoin(k,x,y,mul=1){
  if(R.coins.length>=COIN_CAP){const j=R.coins.findIndex(c=>c.on);R.coins.splice(j>=0?j:0,1);}
  const c={id:uid(),k,x:clamp(x,14,T.W-14),y,mul,on:0,ft:0,lit:0,gold:0};
  if(k==='pearl'){c.on=1;c.ft=15;}
  R.coins.push(c);return c;

function petMove(p,tx,ty,spd,dt){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1;const k=Math.min(1,dt*3);p.vx+=((d>4?dx/d*spd:0)-p.vx)*k;p.vy+=((d>4?dy/d*spd:0)-p.vy)*k;p.x=clamp(p.x+p.vx*dt,16,T.W-16);p.y=clamp(p.y+p.vy*dt,TOP+12,floorY()-12);if(Math.abs(p.vx)>5)p.dir=p.vx>0?1:-1;return d;}

function monGap(st){const g=st.mon.gap;return rand(g[0],g[1])*(1+tr('alarm')*.06);}
function updateSpawns(dt){
  const st=curStage();let mon=st?st.mon:R.mode==='abyss'?abyssMon():(R.freeMon?{t:freeMonList(),gap:[70,100]}:null);
  if(st&&st.boss&&!R.bossDone&&!R.bossOn){const ba=st.bossAt-(R.hard?20:0);if(R.t>=ba-4&&!X.warned)warnMon(true);if(R.t>=ba){R.bossOn=1;X.warned=false;$('#warn').classList.remove('on');spawnMon(st.boss);if(!SIM.on)bossTalk();}}
  if(!mon||!mon.t.length)return;
  const bossAlive=X.mons.some(m=>MON[m.k].boss);
  if(R.mode==='abyss'){if(X.mons.length>=1+Math.floor(R.depth/6))return;}
  else{if(X.mons.length&&(!bossAlive||X.mons.length>1))return;if(bossAlive)return;}
  R.monT-=dt;
  if(R.monT<=4&&!X.warned)warnMon(false);
  if(R.monT<=0){X.warned=false;if(!SIM.on)$('#warn').classList.remove('on');spawnMon(pick(mon.t));R.monT=(mon.gap?rand(mon.gap[0],mon.gap[1])*(1+tr('alarm')*.06):90)*(R.hard?.75:1)*(R.rule==='rich'?.7:1);}
}
function warnMon(boss){X.warned=true;if(SIM.on)return;sfx('siren');$('#warn').classList.add('on');const b=$('#banner');b.classList.add('red');banner(boss?'수문장이 다가와요':'조심해요!',boss?'수문장 등장!':'침입자가 온다!',2000);setTimeout(()=>b.classList.remove('red'),2100);}
function freeMonList(){const w=R.w;const l=[['ink'],['ink','glut','spiky'],['fog','crab','spiky'],['twin','glut','fog','crab'],['bats','golem'],['harpy','thief'],['comet','voidj'],['knight','wraith']];return l[w]||['ink'];}
async function bossTalk(){const st=curStage();if(!st||S.meta.seen['boss'+st.w])return;S.meta.seen['boss'+st.w]=1;S.paused=true;await dialogue(STORY.w[st.w].boss,{b:{name:MON[st.boss].n,ic:st.boss,col:'#d6456e'}});S.paused=false;}
// --- 한 걸음 ---
function step(dt){
  if(!R||R.done)return;
  R.t+=dt;R.curV=R.rule==='current'?65*Math.sin(R.t*.35):0;if(R.rule==='starrain'){R.srT=(R.srT??8)-dt;if(R.srT<=0){R.srT=8;spawnCoin('star',rand(40,T.W-40),TOP+6);}}if(R.mode==='abyss')abyssStep(dt);if(R.luckyT>0)R.luckyT-=dt;if(R.laraT>0)R.laraT-=dt;if(R.feverT>0)R.feverT-=dt;
  if(!R.cd)R.cd={};for(const k in R.cd)if(R.cd[k]>0)R.cd[k]-=dt;
  X.resoT=(X.resoT||0)-dt;if(X.resoT<=0){X.resoT=.5;calcReso();}
  if(reso('star')){R.starT=(R.starT||20)-dt;if(R.starT<=0){R.starT=20;spawnCoin('star',rand(40,T.W-40),TOP+6);}}
  const nl=rs('net');if(nl&&R.coins.length){R.netT=(R.netT||0)-dt;if(R.netT<=0){R.netT=netGap(nl);let b=null;for(const c of R.coins){if(c.k==='pearl')continue;const key=c.on?c.ft:99+(floorY()-c.y);if(!b||key<b.key2){b=c;b.key2=key;}}if(b){fxRing(b.x,b.y,'#7fd3ff');collectCoin(b);}}}
  updateFood(dt);updateFish(dt);updateCoins(dt);updateMons(dt);updatePets(dt);updateSpawns(dt);updateWordBub(dt);
  if(!SIM.on&&!S.meta.seen.c_mon){const mm=X.mons.find(m=>m.x>50&&m.x<T.W-50);if(mm)coachOnce('c_mon',[{cv:[mm.x,mm.y,monRadius(mm)+18],h:'침입자 출현!',ic:mm.k,t:'침입자는 <b>계속 눌러서</b> 마법봉으로 물리쳐요. 곧 <b>영어 단어 창</b>이 뜨면 맞혀서 <b>단어 크리티컬</b>을 넣어요!'}]);}
  // 실패: 물고기가 없고 살 돈도 없어요
  if(!R.fish.length&&!X.pets.some(p=>p.id==='almi')){let pot=R.money;for(const c of R.coins)pot+=coinValue(c);if(pot<FISH.bub.cost&&!R.done){R.done=1;if(!SIM.on)setTimeout(stageFail,1200);}}
}

function fxRing(x,y,col){if(SIM.on||X.fx.length>=FX_CAP)return;X.fx.push({t:'ring',x,y,col,life:.5,m:.5});}
function fxBeam(x1,y1,x2,y2,col){if(SIM.on||X.fx.length>=FX_CAP)return;X.fx.push({t:'beam',x:x1,y:y1,x2,y2,col,life:.25,m:.25});}
function fxSpark(x,y,col){if(SIM.on||X.fx.length>=FX_CAP)return;X.fx.push({t:'p',x,y,vx:rand(-40,40),vy:rand(-60,-10),col,life:.5,m:.5});}
function fxCircle(x,y,col,r=70){if(SIM.on||X.fx.length>=FX_CAP)return;X.fx.push({t:'circle',x,y,col,r,life:1.1,m:1.1});}
function fxBurst(x,y,col){for(let i=0;i<10;i++)fxSpark(x,y,col);}
function fxHit(x,y,dbl){fxRing(x,y,dbl?'#b494f7':'#ffffff');for(let i=0;i<4;i++)fxSpark(x,y,'#fff27a');}
function updateFX(dt){for(let i=X.fx.length-1;i>=0;i--){const f=X.fx[i];f.life-=dt;if(f.life<=0){X.fx.splice(i,1);continue;}
  if(f.t==='txt')f.y-=28*dt;else if(f.t==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=60*dt;}else if(f.t==='dead'){f.y=Math.min(floorY()-8,f.y+30*dt);}}
  if(X.motes)for(const o of X.motes){o.y-=o.v*dt;o.x+=Math.sin(o.ph+o.y*.02)*.25;if(o.y<TOP){o.y=floorY()-10;o.x=Math.random()*T.W;}}
  for(const b of X.bub){b.y-=b.v*dt;b.x+=Math.sin(b.y*.05)*.3;if(b.y<TOP){b.y=T.H+rand(0,60);b.x=Math.random()*T.W;}}
  if(X.shake>0)X.shake-=dt;if(X.critFlash>0)X.critFlash-=dt;}

function showHelp(){

  <h3>빠르게 즐기기</h3><ul><li><b>콤보</b>: 보물을 1.6초 안에 이어서 모으면 콤보가 쌓여 값이 최대 +60%까지 올라요.</li>

  <li><b>×2</b> 버튼을 누르면 게임이 두 배로 빨라져요.</li></ul>
  <p class=mut style="font-size:12.5px">이 게임은 교육용으로 PopCap Games의 <b>INSANIQUARIUM</b>(광란의 수족관)을 오마주했어요. 원작의 그림·소리·이름은 쓰지 않았어요.</p>
  <h3>영어 단어 (SUCCESS ENGLISH)</h3><ul><li><b>알 조각</b>을 사려면 영어 단어 문제를 맞혀요. 맞히면 바로 사요.</li>
  <li>틀리면 단어 카드로 외우고, <b>20초 뒤 같은 단어</b>를 다시 맞혀야 알 조각을 살 수 있어요.</li>

  <h3>더 많은 바다</h3><ul><li><b>특수 규칙</b>: 어둠의 물·얼음물·해류·부력의 물·황금 물결·별비. 판마다 달라요.</li>
  <li><b>시련의 바다</b>: 세계를 깨면 같은 판을 더 어렵게 다시 할 수 있어요. 보상 2배, 처음 깨면 별자리 점수 +1.</li>
  <li><b>심연 탐사</b>: 끝없이 깊어지는 바다. 강화 재료·장비·유물을 모아 더 깊이 내려가요.</li><li><b>도전 과제</b>: 목표를 이루면 보상을 받아요.</li></ul>
  <h3>장비 · 강화 · 유물</h3><ul><li><b>장비 6칸</b>: 모자·마법봉·망토·부적·반지·물갈퀴. 등급(일반→고급→희귀→영웅→전설→신화)이 높을수록 옵션이 많아요.</li>

// 대화 ({N}은 이름, {N아}{N은}{N을}{N이}{N이로}는 조사 자동)
function fillText(s){const n=S.meta.name||'지기';return s.replace(/\{N(이로|은|을|아|이)?\}/g,(m,j)=>!j?n:j==='이로'?josa(n,'이로'):j==='은'?josa(n,'은는'):j==='을'?josa(n,'을를'):j==='아'?josa(n,'아야'):josa(n,'이가'));}
function dialogue(lines,spk){
  return new Promise(res=>{
    if(!lines||!lines.length)return res();let i=0,typing=null,full='';
    const dlg=$('#dlg'),skip=$('#dlgSkip');dlg.classList.add('on');skip.classList.remove('hidden');
    const line=()=>{const[sp,raw]=lines[i];full=fillText(raw);const s=(spk&&spk[sp])||SPK[sp]||SPK.n;
      const box=$('#dbox');box.classList.toggle('narr',sp==='n');$('#dport').innerHTML=s.ic?I(s.ic):'';
      $('#dname').textContent=s.name==='@'?(S.meta.name||'지기'):s.name;$('#dname').style.color=s.col||'#7a5cc8';
      const el=$('#dtext');el.textContent='';let k=0;clearInterval(typing);
      typing=setInterval(()=>{k+=2;el.textContent=full.slice(0,k);if(k%6===0)sfx('blip');if(k>=full.length){clearInterval(typing);typing=null;}},24);
      box.style.animation='none';void box.offsetWidth;box.style.animation='';};
    const end=()=>{clearInterval(typing);dlg.classList.remove('on');skip.classList.add('hidden');dlg.onclick=null;skip.onclick=null;S.dlgNext=null;res();};
    const next=()=>{if(typing){clearInterval(typing);typing=null;$('#dtext').textContent=full;return;}i++;if(i>=lines.length)return end();sfx('page');line();};
    dlg.onclick=next;skip.onclick=e=>{e.stopPropagation();end();};S.dlgNext=next;line();
  });
}

function fmtWhen(t){const d=new Date(t);return `${d.getMonth()+1}월 ${d.getDate()}일 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
function b64u(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function ub64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const b=atob(t);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function makeCode(){let b=new TextEncoder().encode(JSON.stringify({game:GAME.id,v:1,meta:S.meta,run:S.run})),tag='A';
  if(window.CompressionStream){try{b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());tag='Z';}catch(e){}}
  return 'OPAQ'+tag+':'+b64u(b);}
async function readAny(text){
  text=String(text||'').trim();if(!text)throw new Error('코드를 붙여 넣어 주세요');
  if(/```json/.test(text)){const m=text.match(/```json\s*([\s\S]*?)```/);const o=JSON.parse(m[1]);if(o.game!==GAME.id)throw new Error(GAME.title+' 기록이 아니에요');return o;}
  const m=text.replace(/\s+/g,'').match(/OPAQ([AZ]):([A-Za-z0-9_-]+)/);if(!m)throw new Error('저장 코드 모양이 아니에요 (OPAQ로 시작해요)');
  let b=ub64u(m[2]);if(m[1]==='Z'){if(!window.DecompressionStream)throw new Error('이 브라우저는 이 코드를 읽지 못해요');b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());}
  const o=JSON.parse(new TextDecoder().decode(b));if(o.game!==GAME.id)throw new Error(GAME.title+' 코드가 아니에요');return o;
}

function buildMD(){
  const m=S.meta,d=new Date();const when=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  let md=`# ${GAME.title} 진행 기록\n\n> 게임의 **저장 · 불러오기 → .md 파일 불러오기**로 이 파일을 열면 이어서 할 수 있어요.\n> 맨 아래 \`저장 데이터\` 블록은 고치지 마세요.\n\n`;
  md+=`| 항목 | 내용 |\n|---|---|\n| 이름 | ${m.name||'(이름 없음)'} |\n| 저장한 때 | ${when} |\n| 수족관 지기 | Lv.${m.lv} (특성 점수 ${m.tp}) |\n| 깬 스테이지 | ${m.cleared+1} / ${STAGES.length} |\n| 별가루 | ${m.dust} |\n\n`;
  md+=`## 펫\n\n| 펫 | 레벨 | 모습 |\n|---|---|---|\n`+ALL_PETS.filter(id=>m.pets[id]).map(id=>`| ${PETS[id].n} (${PETS[id].k}) | ${m.pets[id].lv} | ${FORM_N[petForm(m.pets[id].lv)]} |`).join('\n')+'\n\n';
  md+=`## 스테이지 별\n\n`+STAGES.filter(s=>m.stars[s.id]).map(s=>`- ${s.id} ${s.n}: ${'★'.repeat(m.stars[s.id])} (최고 ${fmtTime(m.best[s.id]||0)})`).join('\n')+'\n\n';
  md+=`## 도감 · 진짜 바다 이야기\n\n`+Object.keys(FISH).filter(k=>m.dex.fish[k]).map(k=>`- **${FISH[k].n}** ← ${FISH[k].real}: ${FISH[k].fact.replace(/<[^>]+>/g,'')}`).join('\n')+'\n';
  md+=`\n## 저장 데이터\n\n\`\`\`json\n${JSON.stringify({game:GAME.id,v:1,saved:when,meta:m,run:S.run})}\n\`\`\`\n`;return md;
}
async function saveMD(){const md=buildMD();const nm=(S.meta.name||'지기').replace(/[\\/:*?"<>|\s]/g,'');const d=new Date();
  const fn=`${GAME.file}_${nm}_${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}.md`;
  if(window.showSaveFilePicker&&window.self===window.top){try{const h=await showSaveFilePicker({suggestedName:fn,types:[{description:'마크다운 진행 기록',accept:{'text/markdown':['.md']}}]});const w=await h.createWritable();await w.write(md);await w.close();toast(I('disk')+' 저장했어요: '+esc(h.name));return;}catch(e){if(e&&e.name==='AbortError')return;}}

// 당겨서 새로고침·화면 튕김 막기 (구글 사이트 모바일)
(function(){let sx=0,sy=0;window.__edge={top:true,bot:true};
  const canScroll=(el,dx,dy)=>{for(;el&&el!==document.documentElement;el=el.parentElement){if(!(el instanceof Element))continue;const cs=getComputedStyle(el);
    if(Math.abs(dy)>=Math.abs(dx)){if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+1){if(dy>0&&el.scrollTop>0)return true;if(dy<0&&el.scrollTop+el.clientHeight<el.scrollHeight-1)return true;}}
    else if(/(auto|scroll)/.test(cs.overflowX)&&el.scrollWidth>el.clientWidth+1)return true;}return false;};
  addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
  addEventListener('touchmove',e=>{if(e.touches.length!==1)return;const t=e.touches[0];const dx=t.clientX-sx,dy=t.clientY-sy;const tg=e.target;if(tg&&(tg.tagName==='TEXTAREA'||tg.tagName==='INPUT'))return;
    if(tg!==cv&&canScroll(tg,dx,dy))return;const E=window.__edge;if(tg!==cv&&Math.abs(dy)>Math.abs(dx)&&((dy>0&&!E.top)||(dy<0&&!E.bot)))return;if(e.cancelable)e.preventDefault();},{passive:false});})();
// 보이는 영역에 맞추기 · 전체 화면
const FIT={top:0,h:0,z:1};
// 화면 크기: 자동이면 높이 600px보다 낮은 칸(노트북의 구글 사이트 삽입 칸 등)에서 화면 전체를 줄여 모두 보이게 해요
function uiZoom(h,w){const st=(S.meta&&S.meta.settings&&S.meta.settings.zoom)||'auto';if(st!=='auto')return +st||1;let z=1;if(h<600)z=Math.max(.6,h/600);if(w/z<340)z=Math.max(.55,w/340);return Math.round(z*100)/100;}
function applyFit(top,h){const de=document.documentElement,ds=de.style;const z=uiZoom(h,innerWidth);ds.zoom=z===1?'':String(z);FIT.z=z;
  ds.setProperty('--vt',top/z+'px');ds.setProperty('--vh',h/z+'px');de.classList.toggle('short',innerWidth/z<=1100&&h/z<620);if(S.screen==='game')requestAnimationFrame(resizeTank);if(S.screen!=='game'&&typeof drawPageBG==='function')try{drawPageBG(_bgW);}catch(e){}}
const fitMode=()=>(S.meta&&S.meta.settings&&S.meta.settings.fit)||'auto';
function refit(){applyFit(fitMode()==='off'?0:FIT.top,fitMode()==='off'||!FIT.h?innerHeight:Math.min(FIT.h,innerHeight));}
function initFit(){applyFit(0,innerHeight);addEventListener('resize',()=>{applyFit(FIT.top,FIT.h>0?Math.min(FIT.h,innerHeight):innerHeight);if(S.screen!=='game')drawPageBG(_bgW);});
  if(!('IntersectionObserver' in window))return;const el=document.createElement('div');el.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;visibility:hidden;z-index:-5';document.body.appendChild(el);
  const th=[];for(let i=0;i<=200;i++)th.push(i/200);
  new IntersectionObserver(es=>{const e=es[es.length-1],r=e.intersectionRect,H=innerHeight;let top=0,h=H;
    // 구글 사이트가 삽입 칸을 확대·축소하면 측정값의 단위가 달라져요 → 대상(화면 전체 크기)의 측정 높이로 비율을 바로잡아요
    const bh=e.boundingClientRect.height,k=bh>0&&Math.abs(bh/H-1)>.03?bh/H:1;const rt=r.top/k,rh=r.height/k;
    if(fitMode()!=='off'&&e.isIntersecting&&rh>=260&&rt>=-1&&rt+rh<=H+2&&rh<H-6){top=Math.max(0,Math.round(rt));h=Math.round(rh);}
    window.__edge={top:!e.isIntersecting||r.top<=1,bot:!e.isIntersecting||r.top+r.height>=H-1};if(top===FIT.top&&h===FIT.h)return;FIT.top=top;FIT.h=h;applyFit(top,h);},{threshold:th}).observe(el);}

  const tb=(k,cls,lab)=>featOn(k)?`<button class="btn ${cls}${featNew(k)?' newFeat':''}" data-t=${k}>${lab}${newTag(k)}</button>`:'';
  if(m.name){h+=`<div class=row>${tb('pets','green',I('nest')+' 펫 둥지')}${tb('tal','purple',I('tal')+' 별자리'+(m.tp?' ('+m.tp+')':''))}${tb('dex','blue',I('book')+' 도감')}<button class="btn teal" data-t=words>${I('book')} 영어 단어</button>${tb('gear','purple',I('g_hat')+' 장비')}${tb('ach','gold',I('trophy')+' 도전'+(achReady()?' ('+achReady()+')':''))}</div>${tb('sk','red',I('pearl')+' 연구소<small>진주로 영구 강화</small>')}${featNextHTML()}`;}
  h+=`<div class=row><button class="btn ghost" data-t=save>${I('disk')} 저장 · 불러오기</button><button class="btn ghost" data-t=set>${I('gear')} 설정</button></div>`;
  h+=(EMBED||innerWidth<=900?`<button class="btn ghost" data-t=full>전체 화면으로 하기</button>`:'');
  $('#titleMenu').innerHTML=h;
  $('#lvMini').innerHTML=m.name?`${esc(m.name)} · 수족관 지기 Lv.${m.lv} · ${I('book')} ${lvName(eng().lv)} · 외운 단어 ${wordsMemorized()}`:'';
  $('#titleMenu').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sfx('tap');const k=b.dataset.t;if(FEAT.some(f=>f.k===k))return goFeat(k);({cont:()=>{newX();makePets();showGame();},map:startAdventure,words:renderWords,save:showSaveBox,full:goFull,set:showSettings})[k]();});
  setTimeout(featTick,400);
  $('#saveNote').innerHTML=STORE_OK?`진행 상황은 이 브라우저에 자동으로 저장돼요.`:`<span style="color:#e0456a">${I('lock')} 이 화면에서는 브라우저 자동 저장이 막혀 있어요.</span> 저장 코드를 써 주세요.`;
}
async function startAdventure(){
  if(S.meta.name)return renderMap();
  const nm=await new Promise(res=>{M(`<h2>수족관 지기 이름</h2><p style="text-align:center">이름을 지어 주세요. (이야기 속에서 불러요)</p><input class=inp id=nmIn maxlength=8 placeholder="예: 하늘" style="margin-top:10px;text-align:center;font-size:20px"><div class=mbtns><button class="btn gold big" data-a=ok>시작!</button></div>`,{ok:()=>{const v=$('#nmIn').value.trim().slice(0,8)||'지기';closeM();res(v);}});setTimeout(()=>{const i=$('#nmIn');if(i){i.focus();i.onkeydown=e=>{if(e.key==='Enter')$('#mbox [data-a=ok]').click();};}},50);});
  S.meta.name=nm;if(!S.meta.unl)S.meta.unl={};saveLocal();await new Promise(r=>levelPicker(r));await dialogue(STORY.prologue);renderMap();openStage(0);
}
function showSettings(){
  const st=S.meta.settings;
  const draw=()=>M(`<h2>${I('gear')} 설정</h2><div class=menuCol>
    <div class=row><button class="btn ${st.sound?'gold':'ghost'}" data-a=snd>소리 ${st.sound?'켜짐':'꺼짐'}</button></div>
    <h3>화질 <span class=mut style="font-size:12px">(느린 기기는 '가볍게')</span></h3><div class=row>${[['auto','자동'+(PERF.low?' (가볍게)':'')],['high','선명하게'],['low','가볍게']].map(([v,n])=>`<button class="btn ${st.quality===v?'gold':'ghost'}" data-a="q_${v}">${n}</button>`).join('')}</div>
    <h3>화면 크기 <span class=mut style="font-size:12px">(노트북·구글 사이트에서 잘리면 줄여 보세요)</span></h3><div class=row>${[['auto','자동'+(st.zoom==null||st.zoom==='auto'?` (${Math.round((FIT.z||1)*100)}%)`:'')],['0.6','60%'],['0.75','75%'],['0.9','90%'],['1','100%'],['1.15','115%']].map(([v,n])=>`<button class="btn ${(st.zoom||'auto')===v?'gold':'ghost'}" data-a="z_${v}">${n}</button>`).join('')}</div>
    <h3>보이는 부분에 맞추기 <span class=mut style="font-size:12px">(화면 일부만 보이면 '끄기')</span></h3><div class=row>${[['auto','자동'],['off','끄기']].map(([v,n])=>`<button class="btn ${(st.fit||'auto')===v?'gold':'ghost'}" data-a="fit_${v}">${n}</button>`).join('')}</div>
    <h3>구글 사이트 ⓘ 버튼 피하기</h3><div class=row>${[['auto','자동'+(EMBED?' (켜짐)':' (꺼짐)')],['on','켜기'],['off','끄기']].map(([v,n])=>`<button class="btn ${(st.safe||'auto')===v?'gold':'ghost'}" data-a="sf_${v}">${n}</button>`).join('')}</div>
    <h3>영어 단어</h3><div class=row><button class="btn purple" data-a=lvp>수준: ${lvName(eng().lv)}</button><button class="btn ${st.speak!==false?'gold':'ghost'}" data-a=spk>단어 읽어 주기 ${st.speak!==false?'켜짐':'꺼짐'}</button></div>
    <h3>이름</h3><div class=row><input class=inp id=nm2 maxlength=8 value="${esc(S.meta.name)}"><button class="btn blue" data-a=nm>바꾸기</button></div>
    <h3>학교 <span class=mut style="font-size:12px">(성장 카드에 들어가요 · 비워도 돼요)</span></h3><div class=row><input class=inp id=sch2 maxlength=20 placeholder="예: ○○초등학교" value="${esc(S.meta.school||'')}"><button class="btn blue" data-a=sch>저장</button></div>
    <h3>기록</h3><div class=row><button class="btn red" data-a=wipe>모든 기록 지우기</button></div></div>
    <div class=mbtns><button class="btn gold" data-a=x>닫기</button></div>`,
    {x:()=>{closeM();saveLocal();},_close:()=>{closeM();saveLocal();},snd:()=>{st.sound=!st.sound;draw();},lvp:()=>{closeM();levelPicker(showSettings);},spk:()=>{st.speak=st.speak===false;draw();},
     q_auto:()=>{st.quality='auto';resizeTank();draw();},q_high:()=>{st.quality='high';resizeTank();draw();},q_low:()=>{st.quality='low';resizeTank();draw();},
     ...Object.fromEntries(['auto','0.6','0.75','0.9','1','1.15'].map(v=>['z_'+v,()=>{st.zoom=v;refit();saveLocal();draw();}])),
     fit_auto:()=>{st.fit='auto';refit();saveLocal();draw();},fit_off:()=>{st.fit='off';refit();saveLocal();draw();},
     sf_auto:()=>{st.safe='auto';applySafe();draw();},sf_on:()=>{st.safe='on';applySafe();draw();},sf_off:()=>{st.safe='off';applySafe();draw();},
     sch:()=>{S.meta.school=$('#sch2').value.trim().slice(0,20);saveLocal();toast(S.meta.school?'학교 이름을 저장했어요':'학교 이름을 비웠어요');},
     nm:()=>{const v=$('#nm2').value.trim().slice(0,8);if(v){S.meta.name=v;saveLocal();toast('이름을 바꿨어요');}},
     wipe:async()=>{if(!(await confirmBox('정말 모든 기록(레벨·펫·도감)을 지울까요? 되돌릴 수 없어요.','지우기','취소')))return;if(!(await confirmBox('마지막 확인! 저장 코드를 만들어 두지 않았다면 지금 취소하세요.','정말 지우기','취소')))return;S.meta=defaultMeta();recalcTB();setRun(null);saveLocal();closeM();renderTitle();toast('기록을 지웠어요');}});
  draw();
}

// ===== 성능 재기 (저사양이면 자동으로 가볍게) =====
const PERF={low:false,acc:0,n:0,ms:0,slow:0,last:0};
function perfTick(ms){PERF.acc+=ms;PERF.n++;if(PERF.n>=60){PERF.ms=PERF.acc/PERF.n;PERF.acc=0;PERF.n=0;
  if(S.meta.settings.quality==='auto'&&!PERF.low){if(PERF.ms>9)PERF.slow++;else PERF.slow=0;if(PERF.slow>=3){PERF.low=true;resizeTank();toast('기기에 맞게 화질을 가볍게 바꿨어요');}}}}
window.__perf=()=>({frameMs:+PERF.ms.toFixed(2),low:PERF.low,fish:R?R.fish.length:0,coins:R?R.coins.length:0,fx:X.fx.length,canvas:cv.width+'x'+cv.height});
// ===== 반복 =====
let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  if(S.screen!=='game'||!R)return;
  const t0=performance.now();
  const paused=S.paused||modalOpen()||$('#dlg').classList.contains('on');
  if(!paused){const n=S.meta.settings.fast?2:1;for(let i=0;i<n;i++)step(dt);updateFX(dt);}
  render(ts);
  perfTick(performance.now()-t0);
  if(ts-_hudT>150){_hudT=ts;updateHUD();}
}
setInterval(()=>{if(S.screen==='game'&&R&&!R.done)saveLocal();},5000);

// ===== 모의 실험 (밸런스 점검: 콘솔에서 SIM.stage(0) / SIM.all()) =====
SIM.bot=function(){
  const st=curStage();
  if(SIM.useSkills!==false){for(const k of SK_ORDER){if(!skLv(k)||(R.cd&&R.cd[k]>0))continue;if(k==='storm'&&!X.mons.length)continue;if(k==='magnet'&&R.coins.length<4)continue;useSkill(k);break;}}
  // 1) 침입자
  const m=X.mons.find(m=>!MON[m.k].feed&&(m.inv<=0||X.see)&&m.x>0&&m.x<T.W);
  if(m){tapAt(m.x,m.y);return;}
  const g=X.mons.find(m=>MON[m.k].feed&&m.x>0&&m.x<T.W);
  if(g&&X.food.length<foodMax()){dropFood(g.x,g.y-30);return;}
  // 2) 배고픈 물고기 먹이
  let hf=null;for(const f of R.fish)if(FISH[f.sp].diet==='food'&&f.h>SEEK&&(!hf||f.h>hf.h))hf=f;
  if(hf&&X.food.length<Math.min(foodMax(),Math.ceil(R.fish.length/2))&&R.money>=foodCost()+5){dropFood(hf.x+rand(-10,10),Math.max(TOP+5,hf.y-60));return;}
  // 3) 보물 줍기 (가장 비싼 것)
  let bc=null,bv=-1;for(const c of R.coins){const v=coinValue(c)+(c.on?50:0);if(v>bv){bv=v;bc=c;}}
  if(bc){tapAt(bc.x,bc.y);return;}
};
SIM.shop=function(){
  const keys=shopKeys(),nb=R.fish.filter(f=>f.sp==='bub').length,w=curWorld();const has=k=>R.fish.some(f=>f.sp===k);const can=k=>keys.includes(k)&&itemInfo(k).can;
  const res=k=>{const it=itemInfo(k);return R.money-it.price;};
  if(can('egg')&&(nb>=6||res('egg')>=150))return buy('egg');
  if(can('bub')&&nb<4&&res('bub')>=30)return buy('bub');
  if(can('foodQ')&&R.upg.foodQ<3&&res('foodQ')>100)return buy('foodQ');
  if(can('wand')&&(!STAGES[R.si]||STAGES[R.si].mon)&&R.upg.wand<(STAGES[R.si]?2+w*2+(STAGES[R.si].boss?2:0):10)&&res('wand')>150)return buy('wand');
  if(can('foodN')&&R.upg.foodN<3&&res('foodN')>150)return buy('foodN');
  if(can('bub')&&nb<8&&res('bub')>100)return buy('bub');
  for(const k of ['puff','ghost','seah','firegold','eel','lamp','ray','jelly','koi','octo','fly','clione','parrot','moray','lanternf','sunfish','whaleshark','whale']){if(!can(k))continue;const n=R.fish.filter(f=>f.sp===k).length;
    if(k==='jelly'&&!has('puff')&&!teamLv('almi'))continue;if(k==='whale'&&R.fish.filter(f=>f.sp==='jelly').length<2)continue;if(k==='ray'&&!R.fish.some(f=>f.sp==='bub'&&f.st>=3)&&!teamLv('nyang'))continue;
    if(n<(k==='jelly'?2:1)&&res(k)>200)return buy(k);}
};
SIM.stage=function(si,opt={}){
  const keep={R,X,meta:JSON.stringify(S.meta),scr:S.screen};
  SIM.on=true;S.screen='sim';
  try{
    if(opt.meta)Object.assign(S.meta,opt.meta);
    const m=S.meta;if(opt.team){m.team=opt.team;opt.team.forEach(id=>{if(!m.pets[id])m.pets[id]={lv:opt.petLv||1,xp:0};});}
    startStageSim(si,opt.hard);
    const dt=1/20,cps=opt.cps||3.5,max=opt.max||1500;let a=0,s=0;
    while(R.t<max&&!R.done){step(dt);a-=dt;s-=dt;if(a<=0){a=1/cps;SIM.bot();}if(s<=0){s=.5;SIM.shop();}}
    return{stage:STAGES[si].id,win:R.eggs>=3,time:Math.round(R.t),par:STAGES[si].par,money:R.money,fish:R.fish.length,lost:R.stats.lost,kills:R.stats.kills,earn:R.stats.earn,wand:R.upg.wand};
  }finally{SIM.on=false;R=keep.R;S.run=keep.R;X=keep.X;S.meta=mergeMeta(JSON.parse(keep.meta));S.screen=keep.scr;recalcTB();}
};
SIM.abyss=function(opt={}){const keep={R,X,meta:JSON.stringify(S.meta),scr:S.screen};SIM.on=true;S.screen='sim';
  try{if(opt.meta)Object.assign(S.meta,opt.meta);ensureGear();recalcTB();if(opt.team){S.meta.team=opt.team;opt.team.forEach(id=>{if(!S.meta.pets[id])S.meta.pets[id]={lv:opt.petLv||5,xp:0};});}
    startAbyss(opt.sd||1);const dt=1/20;let a=0,s=0;while(R.t<(opt.max||2400)&&!R.done){step(dt);a-=dt;s-=dt;if(a<=0){a=1/(opt.cps||3.5);SIM.bot();}if(s<=0){s=.5;SIM.shop();}}
    return{depth:R.depth,t:Math.round(R.t),loot:(R.loot||[]).length,mats:R.mats||{},relic:R.relicBox||0,kills:R.stats.kills};}
  finally{SIM.on=false;R=keep.R;S.run=keep.R;X=keep.X;S.meta=mergeMeta(JSON.parse(keep.meta));S.screen=keep.scr;recalcTB();}};
function startStageSim(si,hard){const st=STAGES[si],m=S.meta;recalcTB();
  R={v:1,mode:'story',si,w:st.w,cd:{},feverT:0,money:200+tr('fund')*50+(m.lv-1)*10+rs('start')*40+gs('money'),upg:{foodQ:m.lv>=15?2:1,foodN:m.lv>=8?2:1,wand:1},eggs:0,t:0,fish:[],coins:[],monT:st.mon?st.mon.first:0,bossDone:0,bossOn:0,ward:tr('ward')+Math.floor(gs('ward')),luckyT:0,laraT:0,
    team:m.team.filter(id=>m.pets[id]).slice(0,petSlots(m.lv)),petXP:{},stats:{earn:0,kills:0,lost:0,born:0,dust:0,xp:0,combo:0},uid:1};S.run=R;R.hard=hard?1:0;R.rule=st.rule||(hard?pick(RULE_KEYS):null);
  R.team.forEach(id=>R.petXP[id]=0);newX();const nb=2+(m.lv>=5?1:0)+tr('start');for(let i=0;i<nb;i++)spawnFish('bub',0,200+i*120,TOP+60,{h:.2});makePets();}
SIM.all=function(opt={}){const out=[];for(let i=0;i<STAGES.length;i++){const r=SIM.stage(i,Object.assign({},opt,typeof opt.lvFor==='function'?opt.lvFor(i):{}));out.push(r);}console.table(out);return out;};

// ===== 시작 =====
const EMBED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
function applySafe(){const v=S.meta.settings.safe||'auto';document.documentElement.classList.toggle('safe',v==='on'||(v==='auto'&&EMBED));}
function init(){
  loadLocal();recalcTB();applySafe();initFit();coachInit();
  $('#signTitle').innerHTML=GAME.logo.map(([ch,col],i)=>ch===' '?'<i></i>':`<span style="--c:${col};--d:${(i*.12).toFixed(2)}s">${ch}</span>`).join('');
  $('#signPeek').innerHTML=['bub','jelly','porong','koi'].map(k=>I(k)).join('');
  $('#subTitle').textContent=GAME.subtitle;$('#tagLine').innerHTML=GAME.tagline;
  $('#bMenu').onclick=()=>{sfx('tap');showMenu();};
  $('#bSave').onclick=()=>{sfx('tap');showSaveBox();};
  $('#bFast').onclick=()=>{S.meta.settings.fast=!S.meta.settings.fast;updateFastBtn();saveLocal();sfx('tap');};
  $('#bPause').onclick=()=>{S.paused=!S.paused;$('#pauseVeil').classList.toggle('hidden',!S.paused);$('#bPause').textContent=S.paused?'계속':'멈춤';};
  $('#fileIn').onchange=e=>{handleFile(e.target.files[0]);e.target.value='';};
  addEventListener('dragover',e=>e.preventDefault());
  addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&/\.(md|markdown|txt)$/i.test(f.name))handleFile(f);});
  document.addEventListener('keydown',e=>{if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
    if($('#dlg').classList.contains('on')){if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();S.dlgNext&&S.dlgNext();}else if(e.key==='Escape')$('#dlgSkip').click();return;}
    if(modalOpen()){if(e.key==='Escape'){const l2=$('#modal2').classList.contains('on');$(l2?'#modal2':'#modal').dispatchEvent(new MouseEvent('click'));}return;}
    if(S.screen==='game'&&(e.key==='p'||e.key==='Escape'))$('#bPause').click();
    if(S.screen==='game'&&/^[1-6]$/.test(e.key)){const b=$('#skillBar').querySelectorAll('.sk')[+e.key-1];if(b)useSkill(b.dataset.sk);}});
  addEventListener('pointerdown',()=>ac(),{once:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){saveLocal();if(S.screen==='game'&&!S.paused)$('#bPause').click();}});
  addEventListener('beforeunload',saveLocal);addEventListener('pagehide',saveLocal);
  if(window.ResizeObserver)new ResizeObserver(()=>{if(S.screen==='game')resizeTank();}).observe($('#tankWrap'));
  if(!STORE_OK)setTimeout(()=>toast(I('lock')+' 이 화면에서는 자동 저장이 막혀 있어요. <b>저장 · 불러오기 → 저장 코드</b>를 써 주세요'),800);
  renderTitle();requestAnimationFrame(loop);
}
init();
</script>
